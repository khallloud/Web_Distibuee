# ========== APP CONFIG ==========
spring.application.name=GharbiPI
server.port=8081
server.servlet.context-path=/Gharbi
spring.main.allow-bean-definition-overriding=true

# ========== DATABASE (MySQL) ==========
spring.datasource.url=jdbc:mysql://localhost:3306/GharbiPI?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Aziz96303006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / HIBERNATE ==========
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ========== FILE UPLOAD ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========== ENCODING ==========
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ========== CORS (if you're using it in a config class) ==========
cors.allowed.origins=http://localhost:4200
cors.allowed.methods=GET,POST,PUT,DELETE

# ========== EUREKA CLIENT ==========
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

